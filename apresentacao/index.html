#tl .tk{position:absolute;top:50%;transform:translate(-50%,-50%);font:700 clamp(9px,.62vw,15px) system-ui;color:rgba(255,255,255,.45);padding-top:2.6vh;transition:color .6s}

#tldot b{position:absolute;left:0;top:0;transform:translate(14px,-50%);font:900 clamp(11px,.85vw,20px) system-ui;color:#ffd21f;white-space:nowrap;text-shadow:0 2px 8px #000}

.slide.on .w.k{animation:win .75s cubic-bezier(.2,.9,.25,1.2) both,mark .7s cubic-bezier(.6,0,.2,1) forwards,glow 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--d)*85ms + .3s),calc(var(--d)*85ms + 1s),calc(var(--d)*85ms + 1.8s)}

/* fotos que revelam */

.multc{position:absolute;inset:0;width:100%;height:100%}

.act-fiscal{animation:aLupa 9s ease-in-out forwards}.act-fiscal .body img{animation:wob .5s ease-in-out infinite alternate}

/* ajudando: duas carregando juntas */
.act-help{animation:aWalk 14s linear forwards}.act-help .body img{animation:wob .35s ease-in-out infinite alternate}

{id:'fundacao',cap:'Nasce o Coletivo',h:`<img class="bg kb" src="img_roda2012.jpg" alt="A roda das primeiras reuniões"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">20 de novembro de 2012</p><h2>Na primeira reunião,<br>éramos <span class="y">8</span>.</h2><p class="lead">Oito pessoas sentadas em roda, com uma pergunta. O que a gente pode fazer junto pelo nosso bairro?</p><p class="lead soft">Guarde esse número. Ele vai crescer.</p></div>${mem('sel_H1208.jpg','Novembro de 2012 · Novo Horizonte','Lideranças dos bairros se juntam e fundam o Coletivo. Ali os bairros deixaram de lutar sozinhos.')}`},
{id:'cartazes',h:`<img class="bg kb" src="img_cartazes.jpg" alt="Crianças com cartazes feitos por elas"><div class="shade bottom"></div><div class="wrap rise" style="justify-content:flex-end"><p class="eyebrow">O começo da luta pelo Vetor Oeste</p><h2>As crianças levantaram os primeiros cartazes.</h2><p class="lead" style="max-width:60vw">Elas pediam praça, escola, saúde e respeito. Muitas dessas crianças hoje são jovens e adultos.</p></div>${mem('sel_H1307.jpg','O começo da luta','Cada cartaz era um pedido escrito por uma criança. Vários desses pedidos viraram obra.','top')}`},
{id:'cresce',cap:'2013 · a roda cresce',h:`<img class="bg kb" src="img_reuniao_jan2013.jpg" alt="Reunião de janeiro de 2013"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">2013 · em menos de seis meses</p><div style="display:flex;align-items:baseline;gap:2vw"><span class="count" data-to="8">0</span><span class="big" style="font-size:5vw">→</span><span class="count" data-to="80" data-plus="+">0</span></div><p class="lead">pessoas por reunião. Com regra, tarefa e Livro Ata. Cada pedido anotado virou meta.</p>${links('reuniao80')}</div>${mem('sel_H1326.jpg','Janeiro de 2013 · primeira reunião do ano','60 moradores frente a frente com os secretários de Saúde, Cultura e Serviços Públicos. O asfalto da Rua 8 foi o primeiro pedido da lista.')}`},
{id:'ouvidoria',h:`<img class="bg kb" src="img_ouvidoria.jpg" alt="Urna da Ouvidoria da Comunidade"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">Fevereiro de 2013</p><h2>Voz para quem nunca tinha sido ouvido.</h2><p class="lead">Uma urna amarela na UBS. Qualquer morador escrevia a reclamação, a ideia ou o elogio. Os papéis eram lidos em roda e viravam pauta.</p></div>${mem('sel_H1318.jpg','Fale com o Conselho Gestor','A comunidade passou a ter assento e voz na saúde do bairro. Quem usa a UBS também ajuda a cuidar dela.')}`},
{id:'mulheres',h:`<img class="bg kb" src="img_mulher2014.jpg" alt="Dia da Mulher na Praça Onofre Canedo"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">Em defesa das mulheres</p><h2>A rosa é o símbolo.<br>A luta é o que importa.</h2><p class="lead">Todo Dia da Mulher a rosa abre a conversa. Por trás dela, a defesa da vida das mulheres.</p><div class="steps"><div><b>♀</b>Lei Maria da Penha explicada de porta em porta</div><div><b>♀</b>Mulheres empreendedoras</div><div><b>♀</b>Botão do pânico</div><div><b>♀</b>Patrulha Maria da Penha</div><div><b>♀</b>Homens e Mulheres contra a Violência Doméstica</div></div>${links('mulher13')}</div>${mem('sel_H1442.jpg','Março de 2014 · Dia Internacional da Mulher','Mil rosas entregues de mão em mão. Cada rosa abria uma conversa sobre a vida e a segurança das mulheres.')}`},
{id:'viela',h:`<div class="wrap left rise"><p class="eyebrow">Vielas</p><h2>Onde havia medo, nasceu cor.</h2><p class="lead">Em 2013, vinte grafiteiros e dezenas de moradores pintaram uma viela do Residencial Jundiaí I. Depois veio o resto. Conseguimos a limpeza e a pavimentação de todas as vielas, com acessibilidade, e iluminação na maioria delas.</p>${links('viela')}</div><div class="gal g3">${img('viela4.jpg','Moradores na viela pintada')}${img('viela1.jpg','Meninas pintando a viela')}${img('viela2.jpg','Viela colorida')}</div>`},
{id:'arraia',h:`<img class="bg kb" src="img_show.jpg" alt="Multidão no Arraiá à noite"><div class="shade bottom"></div><div class="wrap rise" style="justify-content:flex-end"><p class="eyebrow">Desde 2013 · no calendário oficial da cidade</p><h1>Arraiá Nordestino</h1><p class="lead" style="max-width:60vw">A região tem raiz nordestina e decidiu celebrar. Quadrilha, forró e a rua cheia de família. Quem já dançou na quadrilha, levanta a mão.</p>${links('arraia3','arraia25')}</div>`},
{id:'onofre',cap:'O bairro muda de cara',ba:['onofre_antes.jpg','onofre_2013.jpg','ago 2013','out 2013'],h:`<div class="bapanel rise"><p class="eyebrow">Outubro de 2013</p><h2>Praça Onofre Canedo</h2><p class="lead">Um matagal dividido por um córrego virou 30 mil m² de pista, parquinho, academia, quadra sintética e o coração da região.</p>${links('onofre','lazer13','cil')}</div>`},
{id:'slack',h:`<div class="wrap left rise"><p class="eyebrow">2013 · antes da praça existir</p><h2>A molecada já ocupava aquele chão.</h2><p class="lead">Slackline no lugar onde hoje está a Praça Onofre Canedo, com espaço de lazer e quadra sintética. A gente ocupou primeiro e depois conquistou.</p>${links('bosque')}</div><div class="gal g2">${imgc('slack1.jpg','Slackline em 2013','2013 · antes da praça existir, a molecada já ocupava o terreno')}${imgc('sel_CQ08.jpg','A praça vista de cima','Hoje · área de lazer e campo sintético, vista de cima')}</div>`},
{id:'upa',h:`<div class="wrap left rise"><p class="eyebrow">2012 → 2013 → 2018</p><h2>A UPA que a gente escolheu onde ia ficar.</h2><div class="steps"><div><b>2012</b>a comunidade luta para a UPA ser neste terreno, entre os bairros</div><div><b>2013</b>a obra começa</div><div><b>2018</b>UPA Vetor Oeste e Clínica da Família abertas</div><div><b>2022</b>os atendimentos dobram</div><div><b>Hoje</b>Clínica da Família 1, Clínica da Família 2 e novas UBS</div></div>${links('upaobra','upa','upa2x')}</div><div class="gal g3">${imgc('upa_terreno.jpg','Terreno escolhido para a UPA','2012 · o terreno entre os bairros que a comunidade lutou para ser da UPA')}${imgc('upa_2013.jpg','Obra da UPA em 2013','Novembro de 2013 · a obra da UPA a todo vapor')}${imgc('sel_CQ09.jpg','UPA 24h e Clínica da Família','Hoje · UPA 24h e Clínica da Família atendendo a região')}</div>`},
{id:'rua8',ba:['rua8_antes.jpg','ruanova.jpg','2013','2014'],h:`<div class="bapanel rise"><p class="eyebrow">Pedido número um da primeira reunião</p><h2>Rua 8, do barro ao asfalto</h2><p class="lead">Sem poeira em casa, sem lama no ônibus. E as crianças correndo na rua nova.</p><div class="steps"><div><b>1ª fase</b>o asfalto chega em 2014</div><div><b>2ª fase</b>a obra é completada em 2020</div></div>${links('rua8a','rua8b','agua8')}</div>`},
{id:'asfalto',h:`<img class="bg kb" src="img_rua8_conquista.jpg" alt="Rua Oito, uma conquista da comunidade"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">Asfalto, luz e caminho</p><h2>Cada rua tem uma luta.</h2><p class="lead">Daniel Pellizzari no Bairro do Poste. Jardim Pellizzari e Água Doce. Asfalto no Retentem com abaixo-assinado. Luz na Alameda CESP. Novas linhas de ônibus.</p>${links('poste','cesp','linhas')}</div>${mem('sel_H1438.jpg','Maio de 2014 · Rua 8, à noite','Moradores reunidos na rua para acompanhar a obra do asfalto. A conquista se fiscaliza junto, de perto.')}`},
{id:'moradia',h:`<div class="wrap left rise"><p class="eyebrow">Moradia digna</p><h2>Casa, documento e dignidade.</h2><div class="steps"><div><b>1.088</b>apartamentos novos</div><div><b>340</b>escrituras num só dia, depois de mais de 40 anos</div><div><b>258</b>matrículas em 2025 e matrícula definitiva em 2026</div><div><b>123</b>casas reformadas pelo Viver Melhor</div></div><p class="quote" style="font-size:2vw">“Criamos nossos filhos aqui e esperamos muito por isso.”</p>${links('escrituras','mat26','vm123')}</div><div class="gal g2">${imgc('predios.jpg','Prédios subindo','Os prédios dos 1.088 apartamentos saindo do papel')}${imgc('fumas2015.jpg','Futuros moradores reunidos','2015 · futuros moradores dos apartamentos recebem orientação. O Coletivo acompanhou as famílias em todo o processo')}</div>`},
{id:'ponte',ba:['ponte_antes.jpg','ponte_obra.jpg','2014','2015'],h:`<div class="bapanel rise"><p class="eyebrow">21 de novembro de 2015</p><h2>Ponte Novo Horizonte e Tulipas</h2><p class="lead">Da pinguela de madeira a 40 metros de ponte. Vizinhos que não se alcançavam passaram a se encontrar.</p>${links('ponte')}</div>`},
{id:'criancas',cap:'Esporte, lazer e crianças',h:`<div class="wrap left rise"><p class="eyebrow">2015 · praças e espaços de convivência</p><h2>As crianças das fotos hoje são jovens.</h2><p class="lead">Rolimã, slackline, capoeira, skate, campo de futebol, Centro Esportivo renovado e quadra coberta. Se você se reconhecer, levanta a mão.</p>${links('cee','campo','quadra')}</div><div class="gal g4">${imgc('rolima1.jpg','Oficina de rolimã','2013 · oficina de carrinho de rolimã no Almerinda Chaves')}${imgc('capoeira.jpg','Roda de capoeira','Capoeira gratuita para as crianças')}${imgc('sel_H1511.jpg','Rampa de skate','2015 · rampa de skate entregue aos skatistas, conquista da comunidade')}${imgc('onofre_campo.jpg','Crianças no campo','Novembro de 2014 · campo de futebol da Praça Onofre Canedo')}</div>`},
{id:'if',cap:'O Instituto Federal é nosso',h:`<img class="bg kb" src="img_cafeif4.jpg" alt="Café Coletivo no Instituto Federal"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">O Instituto Federal é nosso</p><h2>Um dos maiores equipamentos públicos da nossa história.</h2><div class="steps"><div><b>2015</b>24 mil m² garantidos</div><div><b>2017</b>abaixo-assinado para a obra começar</div><div><b>2023</b>Café Coletivo de capacete no canteiro</div><div><b>2025</b>campus ampliado</div><div><b>Hoje</b>a gente está aqui dentro, em parceria com a diretora Karina Maretti Strangueto e toda a equipe do campus</div></div>${links('ifarea','ifamp')}</div>${mem('sel_AN14.jpg','2025 · Instituto Federal, Campus Jundiaí','O Coletivo comemorou o aniversário dentro do campus que a comunidade ajudou a conquistar.')}`},
{id:'cafes',cap:'Café Coletivo',h:`<img class="bg kb" src="img_cafeif1.jpg" alt="Café Coletivo lotado"><div class="shade"></div><div class="wrap left rise"><p class="eyebrow">Desde 2015</p><h2>Um café, uma roda, uma cidade nova.</h2><p class="lead">Cada pessoa traz um alimento para a mesa e uma ideia para um bairro, uma cidade e uma região melhores.</p><p class="lead soft">Mesa posta, todo mundo em roda, cada um fala. Várias cidades buscaram copiar essa ideia.</p>${links('cafe21','medeiros','almerinda25','anos13')}</div>${mem('sel_C2114.jpg','Café de 9 anos · 2021','Microfone na mão do morador. No Café, quem fala é a comunidade.','top sm')}${mem('sel_ME10.jpg','Café no Medeiros · 2025','A roda saiu do Vetor Oeste e chegou a outros bairros da cidade.','sm')}`},
{id:'proposta',cap:'Proposta e resultado',h:`<div class="wrap rise" style="justify-content:flex-start;padding-top:4vh;padding-bottom:4vh"><p class="eyebrow">Proposta e resultado</p><h2 style="font-size:3.3vw">A comunidade pediu. A comunidade conquistou.</h2><div class="prop"><div class="pa" style="--r:0"><b>2012</b>Asfalto na Rua 8, o primeiro pedido da primeira reunião</div><div class="ar" style="--r:0">→</div><div class="pb" style="--r:0"><b>2014</b>asfalto chega, e em 2020 a obra é completada</div><div class="pa" style="--r:1"><b>2012</b>UPA no terreno entre os bairros</div><div class="ar" style="--r:1">→</div><div class="pb" style="--r:1"><b>2018</b>UPA 24h e Clínica da Família abertas</div><div class="pa" style="--r:2"><b>2013</b>Lazer no lugar do matagal do Almerinda</div><div class="ar" style="--r:2">→</div><div class="pb" style="--r:2"><b>2013</b>Praça Onofre Canedo, 30 mil m²</div><div class="pa" style="--r:3"><b>2014</b>Uma passagem de verdade até o Tulipas</div><div class="ar" style="--r:3">→</div><div class="pb" style="--r:3"><b>2015</b>ponte de 40 metros no lugar da pinguela</div><div class="pa" style="--r:4"><b>2014</b>Comunidade pede um Centro Esportivo</div><div class="ar" style="--r:4">→</div><div class="pb" style="--r:4"><b>2015</b>Centro Esportivo renovado, e hoje lutamos por um novo</div><div class="pa" style="--r:5"><b>2021</b>Plano de Bairros pede a sede do Instituto Federal</div><div class="ar" style="--r:5">→</div><div class="pb" style="--r:5"><b>2025</b>campus ampliado</div><div class="pa" style="--r:6"><b>2021</b>Plantio de árvores nos bairros</div><div class="ar" style="--r:6">→</div><div class="pb" style="--r:6"><b>2021</b>mil mudas plantadas no mesmo dia</div><div class="pa" style="--r:7"><b>2021</b>Mais médicos na UPA</div><div class="ar" style="--r:7">→</div><div class="pb" style="--r:7"><b>2022</b>atendimentos dobram</div><div class="pa" style="--r:8"><b>2025</b>Carta compromisso pede regularização fundiária</div><div class="ar" style="--r:8">→</div><div class="pb" style="--r:8"><b>2026</b>matrícula definitiva das casas do Novo Horizonte</div></div></div>`},
{id:'bilhao',cap:'O resultado',h:`<img class="bg kb" src="img_cafeif2.jpg" alt=""><div class="shade full"></div><div class="wrap rise center"><p class="eyebrow">A região dos invisíveis virou a que mais recebeu</p><p class="count">+ de R$ <span data-to="1">0</span> bilhão</p><p class="lead">em conquistas para a nossa região em 14 anos.</p><p class="big" style="font-size:4.2vw"><span class="y" data-to="${CONQ.length}">0</span> conquistas registradas</p></div>`},
{id:'crescimento',cap:'Somos centenas',h:`<div id="grid"></div><div class="gcount" id="gcount"><p class="eyebrow">Começou com 8</p><div class="count" id="gnum">8</div><p>rostos e fotos dos nossos encontros</p><div id="gname"></div></div><div class="gfinal" id="gfinal"><h1>Começou com 8.<br>Hoje somos centenas.</h1></div>`},
{id:'formigas',cap:'Juntas somos muitas',noLogo:1,h:`<canvas id="antc"></canvas><div class="antcap"><p class="eyebrow" id="antEb">Começou com 8</p><h2 id="antT">Formiga sozinha não carrega folha grande.</h2><div class="antnum" id="antN">8</div></div>`},
{id:'cidade',h:`<div class="citytxt rise"><p class="eyebrow">Da rua para a cidade</p><h2 id="ctitle">Começou na nossa rua.</h2></div><div class="rings" id="rings"></div><div class="citycount"><div class="count" id="cnum" style="font-size:9vw">0</div><p class="lead">bairros e cidades na nossa roda</p></div>`},
{id:'desempre',cap:'Sempre na roda',h:`<div class="wrap rise" style="justify-content:center"><p class="eyebrow">Os nomes que mais aparecem nas nossas listas de presença, de 2013 a 2025</p><h2>Vocês nunca soltaram a mão.</h2><p class="big" style="font-size:2.6vw;margin:.1em 0 .3em"><span class="y">+ de <span data-to="300">0</span></span> conselheiros voluntários. Somos muito gratos.</p><div class="topnames">${["Jannaina", "José Roberto Arantes", "José Paulo de Assis", "Antonio Barros", "Maria Eunice", "Jefferson", "Dagmar", "Gislaine", "Nilma", "William", "Karla Andrilli", "Ruth Rocha", "José Bessa", "Fátima Bessa", "Claudemir", "Dona Elda", "Wallace", "Dona Mariza", "Pabola", "Letícia Silveira", "Lia Cayres", "Maria do Carmo", "José Francisco", "Dona Lindinalva", "Cynthia", "Cadu Vieira", "Melissa"].map((n,i)=>`<span style="--i:${i}">${n}</span>`).join('')}</div><div class="morenames">${["Avelino", "Eliezer", "Denise", "Patrícia Hemel", "Fabrício Melo", "Maria Delma", "Maria Ju", "Edna", "Mariana", "Eliete", "Ricardo Paulino", "Kiko Odilon", "Maria Rosa", "Cláudia Silveira", "Cláudio David", "Auzeni", "Diego Moreno", "Vinícius", "Valquíria", "Emerson", "Liliane", "Thiago", "Eliana", "Maciel", "Fernando", "Michelly", "Jessica", "Cristiano", "Marcelo", "Adriana", "Isabel", "Ivani", "Seu Paulo", "Alcides", "Edson", "Josiane Ferrari", "Jheniffer", "Tenório Palma", "Ederlânio", "Stephany", "Quezia"].map(n=>`<span>${n}</span>`).join('')}</div></div>`},
{id:'falta',cap:'O que ainda falta',h:`<img class="bg kb" src="img_noite1.jpg" alt=""><div class="shade full" style="background:rgba(3,8,30,.84)"></div><div class="wrap rise" style="justify-content:flex-start;padding-top:6vh"><p class="eyebrow">O que a gente pediu e ainda não chegou</p><h2>O que ainda falta para a nossa região.</h2><div class="fgrid"><div class="fcol"><h3>Cuidar das pessoas</h3><ul><li style="--k:0">Acolhimento digno para quem vive na rua no nosso bairro</li><li style="--k:1">Mais moradia popular</li><li style="--k:2">Reforma das unidades de saúde</li></ul></div><div class="fcol"><h3>Segurança</h3><ul><li style="--k:3">Um grupo de trabalho de segurança pública com a comunidade</li><li style="--k:4">Câmeras nas entradas dos bairros</li><li style="--k:5">Iluminação LED em toda a região</li></ul></div><div class="fcol"><h3>Caminhos</h3><ul><li style="--k:6">Passarela na Rodovia Vice-Prefeito Hermenegildo Tonolli</li><li style="--k:7">Recapeamento das ruas da região</li><li style="--k:8">Duplicação da Estrada do Varjão. Luta antiga, já prometida, ainda no papel</li><li style="--k:9">Terminal de ônibus no Novo Horizonte</li></ul></div><div class="fcol"><h3>Futuro</h3><ul><li style="--k:10">Nova escola</li><li style="--k:11">Reforma e ampliação das escolas</li><li style="--k:12">Um novo Centro Esportivo de verdade</li><li style="--k:13">Esgoto no Poste e no Traviú</li></ul></div></div></div>`},
{id:'multiplica',cap:'Multiplicadores',noLogo:1,h:`<div class="mantra" id="mantra"></div>`},
{id:'missao',cap:'A sua missão',h:`<div class="wrap rise" style="justify-content:flex-start;padding-top:5vh"><p class="eyebrow">Ninguém sai daqui do mesmo jeito que chegou</p><h2>Qual é a sua missão a partir de hoje?</h2><div class="mgrid"><div class="mcard" style="--k:0"><span class="mnum">1</span><h3>Olhos na rua</h3><p>Viu lâmpada apagada, buraco ou mato alto? Fotografe e mande para o Coletivo.</p><small>iluminação, recapeamento, zeladoria</small></div><div class="mcard" style="--k:1"><span class="mnum">2</span><h3>Eu moro, eu cuido</h3><p>Adote um pedaço da sua rua. Plante uma muda, cuide da praça, chame o vizinho.</p><small>bairro limpo e cuidado</small></div><div class="mcard" style="--k:2"><span class="mnum">3</span><h3>Traga mais um</h3><p>No próximo Café, venha com alguém que nunca sentou na nossa roda.</p><small>mais força e mais voz</small></div><div class="mcard" style="--k:3"><span class="mnum">4</span><h3>Voz nos conselhos</h3><p>Participe do conselho da UBS, da escola ou de segurança do seu bairro.</p><small>saúde, escolas, segurança</small></div><div class="mcard" style="--k:4"><span class="mnum">5</span><h3>Mão estendida</h3><p>Conhece alguém vivendo na rua? Ajude essa pessoa a chegar ao acolhimento.</p><small>dignidade para todos</small></div><div class="mcard" style="--k:5"><span class="mnum">6</span><h3>Sua ideia no papel</h3><p>Escreva hoje a sua proposta para o bairro e deixe na mesa do café.</p><small>o próximo plano de bairros</small></div></div><p class="lead y mend">Escolha uma. Comece amanhã. E conte para a roda no próximo Café.</p></div>`},
{id:'palavra',cap:'Palavra',noLogo:1,h:`<div class="wrap rise center slow" style="background:radial-gradient(circle at 50% 40%,#2a1b05,#0a0702 75%)"><div class="verse" style="--k:0"><p class="quote" style="font-size:5vw">“Levantemo-nos e edifiquemos.”</p><p class="who">Neemias 2:18</p></div><h2 class="y verse" style="--k:1">Começou com 8. Agora somos centenas construindo juntos.</h2></div>`},
{id:'voce',h:`<img class="bg kb" src="img_maos.jpg" alt=""><div class="shade full"></div><div class="wrap rise slow"><h1>Você é importante<br>para nós.</h1><p class="lead" style="max-width:62vw">Tudo o que você viu começou com 8 pessoas numa roda, olhando no olho. Você está fazendo diferença por estar aqui hoje. Com você a gente tem mais força e mais voz para chegar lá.</p><p><span class="pill" style="font-size:4vw;padding:.2em .8em">Faça parte.</span></p></div>`},
