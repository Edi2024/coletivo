<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Coletivo Vetor Oeste">
<meta property="og:description" content="Desde 2012, moradores do Vetor Oeste de Jundiaí decidindo juntos. Veja a história, as conquistas e participe.">
<meta property="og:image" content="eu-amo-vetor-oeste.jpg">
<link rel="icon" href="formiga.png">
<title>Coletivo Vetor Oeste</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Coletivo Vetor Oeste, Jundiaí, Brasil. Desde 2012, moradores de 15 bairros organizados em participação coletiva. Community organizing in Jundiaí, Brazil. Participación comunitaria. Participation citoyenne. 社区参与。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: portal em páginas (abas no topo), uma coluna larga que vira uma no celular; azul-marinho, laranja da formiga e amarelo; cada página tem uma abertura curta e um bloco interativo */
:root{
  --bg:#F6F8FB; --surface:#FFFFFF; --ink:#10233A; --muted:#536276; --line:#DCE3EC; --soft:#EEF3F9;
  --navy:#0E2A47; --azul:#0B6FB8; --ceu:#1DA1DA; --laranja:#F28A1E; --laranja-forte:#D9601A; --amarelo:#F6C445; --verde:#2E9E4F;
  --zap:#1E8E4A;
  --display:"Barlow Condensed","Arial Narrow","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1624;--surface:#13233A;--ink:#EAF1F8;--muted:#A6B6C8;--line:#24384F;--soft:#172B44;--azul:#4BA3E6;--laranja-forte:#F28A1E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1624;--surface:#13233A;--ink:#EAF1F8;--muted:#A6B6C8;--line:#24384F;--soft:#172B44;--azul:#4BA3E6;--laranja-forte:#F28A1E;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1;margin:0;text-wrap:balance}
h1,h2{text-transform:uppercase}
h2{font-size:clamp(34px,5.6vw,54px);font-weight:800}
h3{font-size:23px;font-weight:700}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:16px;color:var(--laranja-forte)}
.muted{color:var(--muted)}
.sec{padding-block:44px}
.cab{display:flex;flex-direction:column;gap:10px;max-width:760px;margin-bottom:26px}
.cab p{color:var(--muted);font-size:19px}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--navy)}
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.topo .l1{display:flex;align-items:center;gap:12px;min-height:58px}
.topo .marca{height:44px;width:auto}
.langs{margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.langs button{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;border:0;background:transparent;color:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;min-height:34px}
.langs button[aria-pressed="true"]{background:var(--amarelo);color:#2A1E00}
.abas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.abas::-webkit-scrollbar{display:none}
.abas a{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-decoration:none;white-space:nowrap;padding:7px 13px;border-radius:999px;color:#D3E3F2}
.abas a[aria-current="page"]{background:#fff;color:var(--navy)}
.abas a.cta{background:var(--laranja);color:#2A1300}

/* páginas */
.view[hidden]{display:none!important}
.pagehead{background:linear-gradient(165deg,var(--navy),#0A4E8A);color:#fff;padding-block:36px 40px}
.pagehead .eyebrow{color:var(--amarelo)}
.pagehead h2{margin-top:8px}
.pagehead p{color:#D3E3F2;font-size:19px;margin-top:10px;max-width:68ch}

/* início */
.hero{background:linear-gradient(170deg,var(--navy) 0%,#0A4E8A 58%,var(--ceu) 100%);color:#fff;padding-block:38px 56px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}
.hero .onde{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--amarelo);font-size:16px}
.hero h1{font-size:clamp(42px,7.4vw,82px);font-weight:800;margin-top:10px}
.hero h1 span{color:var(--amarelo)}
.hero .lead{font-size:20px;color:#E3EEF8;margin-top:16px;max-width:44ch}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 22px;border-radius:999px;font-weight:700;font-size:18px;text-decoration:none;border:0;cursor:pointer}
.btn svg{width:22px;height:22px;flex:none}
.btn-zap{background:var(--zap);color:#fff}
.btn-sol{background:var(--amarelo);color:#2A1E00}
.btn-vazio{border:2px solid rgba(255,255,255,.75);color:#fff;background:transparent}
.btn-nav{background:var(--navy);color:#fff}
.heroimg{position:relative}
.heroimg .foto{border-radius:24px;aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.heroimg .ant{position:absolute;width:40%;right:-4%;bottom:-16%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35));animation:boia 4.5s ease-in-out infinite}
@keyframes boia{50%{transform:translateY(-8px)}}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:-30px;position:relative}
.num{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px rgba(16,35,58,.08)}
.num b{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1;color:var(--azul);display:block;font-variant-numeric:tabular-nums}
.num span{font-size:14px;color:var(--muted);display:block;margin-top:4px;line-height:1.3}
.nome{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:28px}
.nome .data{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,64px);line-height:.9;color:var(--laranja-forte);text-align:center}
.nome .data small{display:block;font-size:20px;color:var(--muted);letter-spacing:.06em}
.nome p{font-size:19px}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.atalho{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.atalho:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(16,35,58,.12)}
.atalho img{aspect-ratio:16/10;object-fit:cover;width:100%}
.atalho div{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.atalho b{font-family:var(--display);font-size:24px;line-height:1;text-transform:uppercase}
.atalho span{font-size:15px;color:var(--muted)}
.jeito{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.jeito div{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.jeito svg{width:40px;height:40px;color:var(--laranja-forte)}
.jeito b{font-family:var(--display);font-size:22px;line-height:1.05;text-transform:uppercase}
.jeito span{font-size:15px;color:var(--muted)}
.voz-destaque{background:var(--navy);color:#fff;border-radius:24px;padding:28px;display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center}
.voz-destaque img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--amarelo)}
.voz-destaque q{font-family:var(--display);font-size:clamp(26px,4vw,38px);line-height:1.1;display:block}
.voz-destaque q::before,.voz-destaque q::after{content:""}
.voz-destaque .quem{margin-top:10px;color:var(--amarelo);font-weight:700}
.voz-destaque .tr{margin-top:6px;color:#C7D6E6;font-size:15px}

/* história */
.anos{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.anos button{font-family:var(--display);font-weight:800;font-size:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;flex:none;min-width:64px}
.anos button[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:#2A1300}
.anos button.fase{border-color:transparent;background:var(--soft)}
.fases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.fases div{border-radius:16px;padding:14px 16px;color:#fff}
.fases b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block;line-height:1}
.fases span{font-size:14px;opacity:.9}
.f1{background:var(--azul)}.f2{background:var(--laranja-forte)}.f3{background:var(--navy)}
.ano-det{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:18px;align-items:start}
.ano-det .grande{font-family:var(--display);font-weight:800;font-size:96px;line-height:.85;color:var(--azul)}
.evs{display:grid;gap:10px;margin-top:12px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ev a{font-size:15px;font-weight:700;color:var(--laranja-forte)}
.ano-det figure{margin:0}
.ano-det figure img{border-radius:18px;width:100%;aspect-ratio:4/3;object-fit:cover}
.ano-det figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.navano{display:flex;gap:10px;margin-top:16px}
.navano button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px}

/* participação */
.graf{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.graf .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:38px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.graf .box{overflow-x:auto}
.graf svg{display:block;min-width:680px;width:100%;height:auto}
.graf svg .bar{cursor:pointer}
.detalhe{margin-top:12px;background:var(--soft);border-radius:14px;padding:12px 16px;font-size:16px;min-height:52px}
.metodo{font-size:14px;color:var(--muted);margin-top:10px}
.mob{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mob div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;border-top:5px solid var(--laranja)}
.mob b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--azul);display:block}
.mob em{font-style:normal;font-family:var(--display);font-weight:700;color:var(--laranja-forte);font-size:16px;letter-spacing:.05em}
.mob span{font-size:15px;color:var(--muted);display:block}
.encontros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.enc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.enc .d{font-family:var(--display);font-weight:700;color:var(--laranja-forte);font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.enc p{font-size:15px;color:var(--muted)}
.vozes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.voz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--amarelo)}
.voz q{font-family:var(--display);font-size:24px;line-height:1.1}
.voz .tr{font-size:15px;color:var(--muted);font-style:italic}
.voz .quem{font-size:15px;font-weight:700}
.voz a{font-size:14px;color:var(--azul);font-weight:700}

/* conquistas */
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filtros button{font-family:var(--display);font-weight:700;font-size:17px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 15px;cursor:pointer;min-height:40px}
.filtros button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.ok{background:#D9F0E0;color:#14632F}.and{background:#FCF0C8;color:#7A5600}.cob{background:#D7ECF9;color:#0B4F86}.cat{background:var(--soft);color:var(--muted)}
.card p{font-size:15px;color:var(--muted)}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.placar div{border-radius:18px;padding:16px;text-align:center}
.placar b{font-family:var(--display);font-weight:800;font-size:48px;line-height:1;display:block}
.placar .p1{background:#D9F0E0;color:#14632F}.placar .p2{background:#FCF0C8;color:#7A5600}.placar .p3{background:#D7ECF9;color:#0B4F86}
.lista{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lista li a,.lista li .row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:baseline;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none}
.lista .d{font-family:var(--display);font-weight:700;color:var(--laranja-forte);font-size:18px;font-variant-numeric:tabular-nums}
.lista .t{font-weight:700}
.lista .v{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--azul);white-space:nowrap}

/* galeria */
.gal{columns:3 260px;column-gap:12px}
.gal button{display:block;width:100%;margin:0 0 12px;break-inside:avoid;border:0;padding:0;background:none;cursor:zoom-in;border-radius:16px;overflow:hidden;position:relative;text-align:left}
.gal img{width:100%;height:auto}
.gal span{position:absolute;left:10px;bottom:10px;background:rgba(14,42,71,.86);color:#fff;font-size:14px;padding:4px 10px;border-radius:8px}
.lb{position:fixed;inset:0;z-index:30;background:rgba(5,14,26,.92);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden],.toast[hidden]{display:none!important}
.lb img{max-height:78vh;width:auto;max-width:100%;border-radius:12px}
.lb p{color:#fff;text-align:center;margin-top:10px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:#fff;color:var(--navy);border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px}

/* orçamento */
.niveis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nivel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:8px}
.nivel .val{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--azul)}
.nivel .st{align-self:flex-start;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 12px}
.st.aberto{background:#D9F0E0;color:#14632F}.st.fechado{background:#F6D9D9;color:#8A1F1F}
.nivel ul{margin:0;padding-left:18px;font-size:15px;color:var(--muted);display:grid;gap:4px}
.nivel a{font-size:14px;color:var(--azul);font-weight:700}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;overflow-x:auto}
.cal table{border-collapse:separate;border-spacing:3px;min-width:720px;width:100%;font-size:14px}
.cal th{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:15px}
.cal td{height:34px;border-radius:6px;background:var(--soft)}
.cal td.rot{background:none;font-weight:700;white-space:nowrap;padding-right:8px;width:190px}
.cal td.m{background:var(--azul)}.cal td.e{background:var(--laranja)}.cal td.u{background:var(--navy)}
.cal td.agora{outline:2px solid var(--amarelo);outline-offset:-2px}
.pauta{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pauta div{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:700}
.aviso{background:#FFF6DA;color:#4A3600;border-radius:16px;padding:14px 18px;font-size:16px}

/* mundo */
.ods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.od{border-radius:18px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:170px}
.od b{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.od span{font-weight:700}
.od p{font-size:14px;opacity:.95}
.o3{background:#4C9F38}.o4{background:#C5192D}.o10{background:#DD1367}.o11{background:#FD9D24;color:#2A1300}.o16{background:#00689D}.o17{background:#19486A}
.agenda{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.agenda li{display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.agenda .q{font-family:var(--display);font-weight:800;color:var(--laranja-forte);font-size:20px;line-height:1.05}
.agenda b{display:block}
.agenda span{font-size:15px;color:var(--muted)}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:p}
.passos div{background:var(--navy);color:#fff;border-radius:18px;padding:18px}
.passos div::before{counter-increment:p;content:counter(p);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--amarelo);color:#2A1E00;font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:10px}
.passos b{font-family:var(--display);font-size:22px;display:block;line-height:1.05;text-transform:uppercase}
.passos span{font-size:15px;color:#C7D6E6}

/* participe */
.opcoes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opcao{display:grid;grid-template-columns:44px 1fr 18px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;min-height:78px}
.opcao svg.ic{width:38px;height:38px;color:var(--zap)}
.opcao svg.seta{width:18px;height:18px;opacity:.5}
.opcao b{display:block;font-size:17px}
.opcao span{font-size:14px;color:var(--muted)}
.votos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.voto{background:var(--laranja);color:#2A1300;border-radius:16px;padding:14px 16px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.voto span{font-size:14px;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px;font-family:var(--body)}

let modo="ano", icpSel=null;
function renderICP(){
  const svg=document.getElementById("icp"); const W=960,H=360,Lm=46,R=10,T=18,B=40;
  const parts=ICP.map(([a,e,c,o,m])=>[a,e*W8.enc,c*W8.conq,o*W8.cob,m*W8.imp]);
  let acc=[0,0,0,0]; const data=parts.map(([a,...v])=>{ if(modo==="acu"){acc=acc.map((x,k)=>x+v[k]);return [a,...acc];} return [a,...v]; });
  const tot=data.map(d=>d.slice(1).reduce((s,x)=>s+x,0)); const max=Math.ceil(Math.max(...tot)/10)*10||10;
  const bw=(W-Lm-R)/data.length, sy=v=>T+(H-T-B)*(1-v/max);
  const tc=getComputedStyle(document.documentElement).getPropertyValue("--muted").trim()||"#536276";
  let s=""; const step=max>100?50:10;
  for(let v=0;v<=max;v+=step){s+=`<line x1="${Lm}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="${tc}" stroke-opacity=".18"/><text x="${Lm-8}" y="${sy(v)+5}" text-anchor="end" font-size="13" fill="${tc}">${v}</text>`;}
  data.forEach((d,i)=>{ let y0=H-B; const x=Lm+i*bw+bw*.15, w=bw*.7;
    d.slice(1).forEach((v,k)=>{ if(!v) return; const hgt=(H-T-B)*v/max; y0-=hgt; s+=`<rect class="bar" data-i="${i}" x="${x}" y="${y0}" width="${w}" height="${hgt}" fill="${CORES[k]}" rx="2"/>`; });
    s+=`<text x="${x+w/2}" y="${sy(tot[i])-6}" text-anchor="middle" font-size="13" font-weight="700" fill="${tc}">${tot[i]}</text>`;
    s+=`<text x="${x+w/2}" y="${H-B+20}" text-anchor="middle" font-size="13" fill="${tc}">${d[0]}</text>`;
    s+=`<rect class="bar" data-i="${i}" x="${Lm+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`;
  });
  svg.innerHTML=s;
  document.getElementById("legIcp").innerHTML=[UI.dEnc,UI.dConq,UI.dCob,UI.dImp].map((n,k)=>`<span><i style="background:${CORES[k]}"></i>${esc(X(n))}</span>`).join("");
  mostraICP(icpSel===null?ICP.length-1:icpSel);
}
function mostraICP(i){
  icpSel=i; const [a,e,c,o,m]=ICP[i]; const p=e*W8.enc+c*W8.conq+o*W8.cob+m*W8.imp;
  document.getElementById("icpDet").innerHTML=`<b>${a}</b> · ${p} ${esc(X(UI.pontos))} · ${esc(X(UI.dEnc))} ${e} · ${esc(X(UI.dConq))} ${c} · ${esc(X(UI.dCob))} ${o} · ${esc(X(UI.dImp))} ${m}`;
}

function renderConq(){
  const ok=CONQ.filter(c=>c[1]==="ok").length, an=CONQ.filter(c=>c[1]==="and").length, lu=CONQ.filter(c=>c[1]==="luta").length;
  document.getElementById("placar").innerHTML=`<div class="p1"><b>${ok}</b>${esc(X(UI.resolvido))}</div><div class="p2"><b>${an}</b>${esc(X(UI.andando))}</div><div class="p3"><b>${lu}</b>${esc(X(UI.naLuta))}</div>`;
  document.getElementById("filtroArea").innerHTML=[["todas",UI.todas],...Object.entries(AREAS)].map(([k,n])=>`<button type="button" data-ar="${k}" aria-pressed="${k===areaSel}">${esc(X(n))}</button>`).join("");
  const st={ok:["ok",UI.resolvido],and:["and",UI.andando],luta:["cob",UI.naLuta]};
  document.getElementById("conqCards").innerHTML=CONQ.filter(c=>areaSel==="todas"||c[0]===areaSel).map(([a,s,t,d])=>`<div class="card"><div class="top"><span class="chip ${st[s][0]}">${esc(X(st[s][1]))}</span><span class="chip cat">${esc(X(AREAS[a]))}</span></div><h3>${esc(X(t))}</h3>${X(d)?`<p>${esc(X(d))}</p>`:""}</div>`).join("");
  document.getElementById("cobLista").innerHTML=COB.map(([d,t,v])=>`<li><div class="row"><span class="d">${d}</span><span class="t">${esc(t)}</span><span class="v">${esc(v)}</span></div></li>`).join("");
}
let impSel="todas";
function renderImp(){
  const fontes=["todas","Prefeitura","Câmara","Tribuna"];
  document.getElementById("filtroImp").innerHTML=fontes.map(f=>`<button type="button" data-fi="${f}" aria-pressed="${f===impSel}">${f==="todas"?esc(X(UI.todas)):f}</button>`).join("");
  document.getElementById("impLista").innerHTML=IMP.filter(r=>impSel==="todas"||r[2]===impSel).map(([d,t,v,u])=>`<li><a href="${u}" target="_blank" rel="noopener"><span class="d">${d||"—"}</span><span class="t">${esc(t)}</span><span class="v">${esc(v)}</span></a></li>`).join("");
}
let galSel="todas";
function renderGal(){
  document.getElementById("filtroGal").innerHTML=Object.entries(GCAT).map(([k,n])=>`<button type="button" data-g="${k}" aria-pressed="${k===galSel}">${esc(X(n))}</button>`).join("");
  document.getElementById("gal").innerHTML=GAL.map((g,i)=>[g,i]).filter(([g])=>galSel==="todas"||g[1]===galSel).map(([[src,c,t],i])=>`<button type="button" data-gi="${i}"><img src="${src}" alt="${esc(X(t))}" loading="lazy" style="${src.endsWith('.png')?'background:#fff;padding:14px':''}"><span>${esc(X(t))}</span></button>`).join("");
}
function renderOrc(){
  document.getElementById("niveis").innerHTML=NIVEIS.map(n=>`<div class="nivel"><span class="st ${n.s}">${esc(X(n.s==="aberto"?UI.aberto:UI.fechado))}</span><h3>${esc(X(n.n))}</h3><div class="val">${n.v}</div><ul>${n.i.map(t=>`<li>${esc(X(t))}</li>`).join("")}</ul><a href="${n.l}" target="_blank" rel="noopener">${esc(X(UI.verNoticia))}</a></div>`).join("");
  let t=`<table><thead><tr><th></th>${MESES.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>`;
  t+=`<tr><td class="rot">${esc(X(CAL[0][0]))} <small>(out–dez 2026)</small></td>${MESES.map((m,k)=>`<td class="${k>=9?'m agora':''}"></td>`).join("")}</tr>`;
  CAL.slice(1).forEach(([r,c,ms])=>{t+=`<tr><td class="rot">${esc(X(r))}</td>${MESES.map((m,k)=>`<td class="${ms.includes(k+1)?c:''}"></td>`).join("")}</tr>`;});
  t+=`</tbody></table>`;
  document.getElementById("cal").innerHTML=t;
  document.getElementById("pauta").innerHTML=PAUTA.map(p=>`<div>${esc(X(p))}</div>`).join("");
}
function renderMundo(){
  document.getElementById("ods").innerHTML=ODS.map(([n,t,p])=>`<div class="od o${n}"><b>${n}</b><span>${esc(X(t))}</span><p>${esc(X(p))}</p></div>`).join("");
  document.getElementById("agenda").innerHTML=AGENDA.map(([q,t,p])=>`<li><span class="q">${esc(X(q))}</span><div><b>${esc(X(t))}</b><span>${esc(X(p))}</span></div></li>`).join("");
  document.getElementById("passos").innerHTML=PASSOS.map(([t,p])=>`<div><b>${esc(X(t))}</b><span>${esc(X(p))}</span></div>`).join("");
  document.getElementById("intOp").innerHTML=INT.map(([k,t,p])=>`<a class="opcao" href="${wa(X(MSG[k]))}" target="_blank" rel="noopener"><svg class="ic"><use href="#globo"/></svg><div><b>${esc(X(t))}</b><span>${esc(X(p))}</span></div><svg class="seta"><use href="#seta"/></svg></a>`).join("");
}
function renderPar(){
  document.getElementById("parOp").innerHTML=PAR.map(([k,ic,t,p])=>`<a class="opcao" href="${wa(X(MSG[k]))}" target="_blank" rel="noopener"><svg class="ic"><use href="#${ic}"/></svg><div><b>${esc(X(t))}</b><span>${esc(X(p))}</span></div><svg class="seta"><use href="#seta"/></svg></a>`).join("");
  document.getElementById("votos").innerHTML=VOTOS.map(v=>`<a class="voto" href="${wa("Oi! Meu voto de prioridade para o meu bairro é: "+v[0]+".\n\nMeu bairro: ____")}" target="_blank" rel="noopener">${esc(X(v))}<span>${esc(X(UI.votar))}</span></a>`).join("");
}
let vozI=0;
function renderInicio(){
  document.getElementById("atalhos").innerHTML=ATALHOS.map(([k,img,d])=>`<a class="atalho" href="#${k}"><img src="${img}" alt="" loading="lazy" ${img.endsWith('.png')?'style="background:#fff"':''}><div><b>${esc(X(UI["nav_"+k]))}</b><span>${esc(X(d))}</span></div></a>`).join("");
  const v=VOZES[vozI%VOZES.length];
  document.getElementById("vozDestaque").innerHTML=`<img src="formiga.png" alt="" style="background:#fff;object-fit:contain;padding:10px"><div><q>${esc(v[0])}</q>${L!=="pt"?`<div class="tr">${esc(X(["",...v[1]]))}</div>`:""}<div class="quem">${esc(v[2])}</div><div class="tr">${esc(v[3])}</div></div>`;
}
function aplicaTextos(){
  document.documentElement.lang=L==="pt"?"pt-BR":(L==="zh"?"zh-Hans":L);
  document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t; if(UI[k]) e.textContent=X(UI[k]);});
  document.querySelectorAll("[data-ta]").forEach(e=>{const k=e.dataset.ta; if(UI[k]) e.alt=X(UI[k]);});
  document.querySelectorAll("[data-msg]").forEach(a=>{a.href=wa(X(MSG[a.dataset.msg]));a.target="_blank";a.rel="noopener";});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L?"true":"false"));
}
function tudo(){aplicaTextos();renderInicio();renderHist();renderPart();renderConq();renderImp();renderGal();renderOrc();renderMundo();renderPar();renderAbas(atual());}
function atual(){const h=(location.hash||"").replace("#","");return VIEWS.includes(h)?h:"inicio";}
function mostra(){
  const v=atual(); VIEWS.forEach(k=>{document.getElementById("v-"+k).hidden=(k!==v);});
  renderAbas(v); window.scrollTo(0,0);
  const ab=document.querySelector('.abas a[aria-current="page"]'); if(ab&&ab.scrollIntoView) ab.scrollIntoView({block:"nearest",inline:"center"});
}
/* eventos */
document.querySelector(".langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;L=b.dataset.l;try{localStorage.setItem("coletivo-lang",L)}catch(_){ }tudo();});
document.getElementById("anos").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;anoSel=b.dataset.a;renderHist();});
document.getElementById("anoDet").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b)return;anoSel=b.dataset.a;renderHist();document.getElementById("anos").querySelector(`[data-a="${anoSel}"]`)?.scrollIntoView({block:"nearest",inline:"center"});});
document.querySelector("#v-participacao .seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;modo=b.dataset.m;document.querySelectorAll("#v-participacao .seg button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));renderICP();});
document.getElementById("icp").addEventListener("click",e=>{const r=e.target.closest(".bar");if(r)mostraICP(+r.dataset.i);});
document.getElementById("filtroVoz").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;vozSel=b.dataset.v;renderPart();});
document.getElementById("filtroArea").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;areaSel=b.dataset.ar;renderConq();});
document.getElementById("filtroImp").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;impSel=b.dataset.fi;renderImp();});
document.getElementById("filtroGal").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;galSel=b.dataset.g;renderGal();});
const lb=document.getElementById("lb");
document.getElementById("gal").addEventListener("click",e=>{const b=e.target.closest("button[data-gi]");if(!b)return;const g=GAL[+b.dataset.gi];document.getElementById("lbImg").src=g[0];document.getElementById("lbImg").alt=X(g[2]);document.getElementById("lbTxt").textContent=X(g[2]);lb.hidden=false;document.getElementById("lbX").focus();});
document.getElementById("lbX").addEventListener("click",()=>lb.hidden=true);
lb.addEventListener("click",e=>{if(e.target===lb)lb.hidden=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")lb.hidden=true;});
window.addEventListener("hashchange",mostra);
const toast=document.getElementById("toast");
document.getElementById("compartilhar").addEventListener("click",async()=>{
  const txt="Coletivo Vetor Oeste, Jundiaí. Veja a nossa história e participe: "+location.href.split("#")[0];
  try{await navigator.clipboard.writeText(txt);toast.textContent=X(UI.copiado);toast.hidden=false;setTimeout(()=>toast.hidden=true,2600);}catch(_){window.location.href=wa(txt);}
});
setInterval(()=>{if(atual()==="inicio"&&!document.hidden){vozI++;renderInicio();}},9000);
/* início */
(function(){let s=null;try{s=localStorage.getItem("coletivo-lang")}catch(_){ } if(s&&LANGS.includes(s))L=s; else {const n=(navigator.language||"pt").slice(0,2).toLowerCase(); if(LANGS.includes(n))L=n;} tudo(); mostra();})();
</script>

</body>
</html>
